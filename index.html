function vTrip(){const t=cur();if(!t){const o=S.orders.filter(x=>x.d).map(x=>`<option value="${x.n}">#${x.n} · ${x.t} ${e(x.o)} → ${e(x.d)} (día ${x.day})</option>`).join('');
return `<div class="card"><h2>Iniciar viaje</h2><label>Orden de rodamiento</label><select id="sn">${o}</select><label>Fecha</label><input type="date" id="sd" value="${new Date().toISOString().slice(0,10)}"><button class="pr" onclick="startTrip()">Iniciar viaje</button></div>`}
const o=S.orders.find(x=>x.n==t.n)||{},a=act(t),by={};a.forEach(x=>by[x.to]=(by[x.to]||0)+x.qty);
return `${ALERT?`<div class="al">${e(ALERT)}<br><button onclick="free()">Liberar sillas</button> <button onclick="ALERT='';render()">Cerrar</button></div>`:''}
<div class="card">${S.bus.photo?`<img class="ph" src="${S.bus.photo}" alt="Bus">`:''}<h2>#${o.n} · ${e(o.o)} → ${e(o.d)}</h2><div class="sm">${t.date} · salida ${o.t} · ${o.m}</div>
<div class="k"><span>Pasajeros a bordo</span><b>${sum(a)}</b></div><div class="k"><span>Ingresos</span><b>${fm(rev(t,true))}</b></div>
<div class="sm">${Object.entries(by).map(([k,v])=>`${e(k)}: ${v}`).join(' · ')||'Toca una silla para registrar'}</div></div>
${grid(t)}
<div class="sm" style="margin:6px 0">🎫 con tiquete · ⚠️ sin tiquete · 🕓 tiquete hecho después</div>
<div class="card"><label>Llegada a destino</label><div class="r"><select id="ap">${places().map(x=>`<option>${e(x)}</option>`).join('')}</select><button onclick="arrive($('ap').value)">Llegué</button></div>
<label class="r" style="color:var(--tx)"><input type="checkbox" style="width:auto" onchange="gps(this.checked)" ${wid?'checked':''}> Alertas por GPS al acercarme (5 km)</label></div>
<button class="pr" onclick="closeTrip()">Cerrar recorrido</button>`}
function startTrip(){const t={id:Date.now(),n:+$('sn').value,date:$('sd').value,st:'open',p:[],e:[],al:[]};S.trips.push(t);S.cur=t.id;save();render()}
function seat(id){const t=cur(),o=S.orders.find(x=>x.n==t.n),ex=act(t).find(x=>x.s==id),p=ex||{from:o.o,to:o.d,qty:1,tk:'si',price:priceOf(o.o,o.d)};
const sl=(i,v)=>`<select id="${i}" onchange="recalc()">${places().map(x=>`<option ${x==v?'selected':''}>${e(x)}</option>`).join('')}</select>`;
modal(`<h3>Silla ${id}</h3><label>Sube en</label>${sl('mf',p.from)}<label>Baja en</label>${sl('mt',p.to)}<label>Cantidad de pasajeros</label><input id="mq" type="number" min="1" value="${p.qty}" oninput="tot()"><label>Precio por pasajero (editable, descuentos)</label><input id="mp" type="number" value="${p.price}" oninput="tot()"><div class="tot" id="tt"></div>
<label>Tiquete</label><select id="mk">${[['si','🎫 Con tiquete'],['no','⚠️ Sin tiquete'],['dp','🕓 Tiquete hecho después']].map(([v,l])=>`<option value="${v}" ${p.tk==v?'selected':''}>${l}</option>`).join('')}</select>
<div class="bt"><button class="pr" style="margin:0" onclick="saveSeat('${id}')">Guardar</button><button onclick="closeM()">Cancelar</button></div>
${ex?`<div class="bt"><button onclick="relSeat('${id}',1)">Bajó (liberar)</button><button onclick="relSeat('${id}',0)">Eliminar</button></div>`:''}`);tot()}
function recalc(){$('mp').value=priceOf($('mf').value,$('mt').value);tot()}
const tot=()=>$('tt').textContent='Total: '+fm($('mq').value*$('mp').value);
function saveSeat(id){const t=cur(),n={s:id,from:$('mf').value,to:$('mt').value,qty:Math.max(1,+$('mq').value||1),price:+$('mp').value||0,tk:$('mk').value,off:false},i=t.p.findIndex(x=>x.s==id&&!x.off);i>=0?t.p[i]=n:t.p.push(n);save();closeM();render()}
function relSeat(id,keep){const t=cur(),i=t.p.findIndex(x=>x.s==id&&!x.off);keep?t.p[i].off=true:t.p.splice(i,1);save();closeM();render()}
function arrive(pl){const t=cur(),a=act(t),d=a.filter(x=>x.to==pl),n=sum(d);ALP=pl;ALERT=`📍 Llegada a ${pl}: se bajan ${n} (${d.map(x=>x.s).join(', ')||'ninguno'}) · siguen ${sum(a)-n}`;navigator.vibrate&&navigator.vibrate([300,100,300]);render()}
function free(){act(cur()).filter(x=>x.to==ALP).forEach(x=>x.off=true);ALERT='';save();render()}
let wid=0;const cd=n=>{const v=Object.values(TN).find(x=>x[0]==n&&x[1]);return v&&[v[1],v[2]]};
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
function gps(on){if(wid){navigator.geolocation.clearWatch(wid);wid=0}if(on&&navigator.geolocation)wid=navigator.geolocation.watchPosition(p=>{const t=cur();if(!t)return;for(const x of act(t)){const c=cd(x.to);if(c&&!t.al.includes(x.to)&&km(p.coords.latitude,p.coords.longitude,c[0],c[1])<5){t.al.push(x.to);arrive(x.to);save();break}}},()=>toast('GPS no disponible'),{enableHighAccuracy:true});else if(on)toast('Este dispositivo no tiene GPS')}
function closeTrip(){if(!confirm('¿Cerrar el recorrido?'))return;const t=cur();t.st='closed';S.cur=null;gps(false);sel=new Set([t.id]);save();go('close')}
// Programación
const cn=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\bVIA\s+(EL\s+)?[A-Z]+/g,'').replace(/\s+/g,' ').trim();
const title=s=>s.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const AL={BOGOTAN:'Bogotá',GIRADOT:'Girardot'};Object.values(TN).forEach(v=>AL[cn(v[0])]=v[0]);const KEYS=Object.keys(AL).sort((a,b)=>b.length-a.length);
function splitOD(s){s=cn(s);for(const k of KEYS)if(s.startsWith(k+' ')){const r=s.slice(k.length+1).trim();return[AL[k],AL[r]||title(r)]}return[title(s),'']}
function parseTxt(t){const out=[];t=t.replace(/(\d{1,3})\s+(DESCANSO|MANTENIMIENTO|RESERVA\s*\d+)\s+(M\/D|O\/D)\s+(\d{1,3})(?!\d)/g,(_,n,l,m,y)=>{out.push({n:+n,t:'',o:l.toUpperCase(),d:'',m,day:+y});return ' '});
const R=/(\d{1,3})\s+(\d{2}:\d{2})(?::\d{2})?\s+(.+?)\s+(M\/D|O\/D)\s+(\d{1,3})(?!\d)/g;let m;while(m=R.exec(t)){const[o,d]=splitOD(m[3]);out.push({n:+m[1],t:m[2],o,d,m:m[4],day:+m[5]})}return out}
async function readPdf(f){await new Promise((ok,er)=>{if(window.pdfjsLib)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=er;document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=d.numPages;i++){t+=(await(await d.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+' '}return t}
function merge(l){l.forEach(o=>{const i=S.orders.findIndex(x=>x.n==o.n);i>=0?S.orders[i]=o:S.orders.push(o)});S.orders.sort((a,b)=>a.n-b.n);save();toast(l.length+' órdenes importadas');render()}
async function imp(){let t=$('it').value;const f=$('if').files[0];try{if(f)t=f.name.toLowerCase().endsWith('.pdf')?await readPdf(f):await f.text()}catch(x){return toast('No pude leer el PDF; pega el texto abajo')}const l=parseTxt(t);l.length?merge(l):toast('No encontré órdenes en el texto')}
function addOrd(){const o={n:+$('an').value,t:$('at').value,o:$('ao').value,d:$('ad').value,m:$('am').value,day:+$('ay').value||0};if(!o.n||!o.o)return toast('Falta orden y origen');merge([o])}
function vProg(){const l=S.orders.filter(x=>(x.n+' '+x.o+' '+x.d).toLowerCase().includes(q.toLowerCase()));
return `<datalist id="pl">${places().map(x=>`<option value="${e(x)}">`).join('')}</datalist>
<div class="card"><h3>Importar rodamiento</h3><input type="file" id="if" accept=".pdf,.txt"><label>o pega el texto del PDF</label><textarea id="it" rows="3"></textarea><button class="pr" onclick="imp()">Importar (une por número de orden)</button></div>
<div class="card"><h3>Agregar manual</h3><div class="r"><input id="an" type="number" placeholder="Orden"><input id="at" type="time"></div><div class="r"><input id="ao" list="pl" placeholder="Origen"><input id="ad" list="pl" placeholder="Destino"></div><div class="r"><select id="am"><option>O/D</option><option>M/D</option></select><input id="ay" type="number" placeholder="Día IT"></div><button class="pr" onclick="addOrd()">Agregar</button></div>
<input placeholder="Buscar orden o ciudad" value="${e(q)}" oninput="q=this.value;renderL()" style="margin-bottom:8px"><div id="ol">${ol(l)}</div>`}
const ol=l=>l.map(x=>`<div class="card r" style="margin:4px 0;padding:8px"><b>#${x.n}</b><span style="flex:1">${x.t} ${e(x.o)}${x.d?' → '+e(x.d):''}<div class="sm">${x.m} · día ${x.day}</div></span><button onclick="delOrd(${x.n})">✕</button></div>`).join('');
const renderL=()=>$('ol').innerHTML=ol(S.orders.filter(x=>(x.n+' '+x.o+' '+x.d).toLowerCase().includes(q.toLowerCase())));
const delOrd=n=>{S.orders=S.orders.filter(x=>x.n!=n);save();renderL()};
// Precios
function vPrice(){return `<datalist id="pl">${places().map(x=>`<option value="${e(x)}">`).join('')}</datalist><div class="card"><h3>Tarifas por combinación</h3><div class="sm">Sirven en ambos sentidos. Si falta una combinación (ej. Villavicencio→San José) se sugiere la diferencia contra Bogotá, y siempre puedes editar el precio al marcar la silla.</div></div>
${S.prices.map((x,i)=>`<div class="card" style="padding:8px"><div class="r"><input list="pl" value="${e(x.a)}" onchange="S.prices[${i}].a=this.value;save()"><span>↔</span><input list="pl" value="${e(x.b)}" onchange="S.prices[${i}].b=this.value;save()"></div><div class="r"><input type="number" value="${x.p}" onchange="S.prices[${i}].p=+this.value;save()"><button onclick="S.prices.splice(${i},1);save();render()">Quitar</button></div></div>`).join('')}
<button class="pr" onclick="S.prices.push({a:'Bogotá',b:'',p:0});save();render()">+ Agregar combinación</button>`}
// Bus
function vBus(){return `<div class="card"><h3>Mi bus</h3>${S.bus.photo?`<img class="ph" src="${S.bus.photo}" alt="Foto del bus">`:''}<label>Foto del carro</label><input type="file" accept="image/*" onchange="photo(this.files[0])"><label>Nombre / número</label><input value="${e(S.bus.name)}" onchange="S.bus.name=this.value;save()"><label>Placa</label><input value="${e(S.bus.plate)}" onchange="S.bus.plate=this.value;save()"><label>Número de sillas (normalmente 40 a 45)</label><input type="number" min="1" max="60" value="${S.bus.seats}" onchange="S.bus.seats=Math.max(1,Math.min(60,+this.value||40));save();render()"></div>
<div class="card"><h3>Distribución de sillas</h3><div class="sm">Toca una silla para quitarla o ponerla (pasillo, baño, silla dañada). Sillas activas: <b>${S.bus.seats-S.bus.off.filter(id=>id<=S.bus.seats).length}</b></div></div>${grid(null,true)}`}
const tg=id=>{const i=S.bus.off.indexOf(id);i>=0?S.bus.off.splice(i,1):S.bus.off.push(id);save();render()};
function photo(f){if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.bus.photo=c.toDataURL('image/jpeg',.7);save();render()};im.src=URL.createObjectURL(f)}
// Cierres
const rev=(t,all)=>t.p.filter(x=>all||S.cfg.notk||x.tk!='no').reduce((s,x)=>s+x.qty*x.price,0),exp=t=>t.e.reduce((s,x)=>s+x.v,0),lbl=t=>{const o=S.orders.find(x=>x.n==t.n)||{};return `#${t.n} ${o.o||''} → ${o.d||''}`};
function vClose(){const L=S.trips.slice().reverse(),T=L.filter(t=>sel.has(t.id)),nt=T.reduce((s,t)=>s+sum(t.p.filter(x=>x.tk=='no')),0);
return `<div class="card"><label class="r" style="color:var(--tx);margin:0"><input type="checkbox" style="width:auto" ${S.cfg.notk?'checked':''} onchange="S.cfg.notk=this.checked;save();render()"> Incluir pasajeros sin tiquete en los cierres</label></div>
<div class="card"><h3>${T.length>1?'Cierre de viaje redondo':'Cierre de recorrido'}</h3>${T.length?`${T.map(t=>`<div class="k"><span>${e(lbl(t))}</span><span>${fm(rev(t)-exp(t))}</span></div>`).join('')}<hr><div class="k"><span>Pasajeros</span><b>${T.reduce((s,t)=>s+sum(t.p.filter(x=>S.cfg.notk||x.tk!='no')),0)}</b></div><div class="k"><span>Sin tiquete (${S.cfg.notk?'incluidos':'excluidos'})</span><b>${nt}</b></div><div class="k"><span>Ingresos</span><b>${fm(T.reduce((s,t)=>s+rev(t),0))}</b></div><div class="k"><span>Gastos</span><b>${fm(T.reduce((s,t)=>s+exp(t),0))}</b></div><div class="k" style="font-size:18px"><span>Neto</span><b>${fm(T.reduce((s,t)=>s+rev(t)-exp(t),0))}</b></div>`:'<div class="sm">Marca uno o varios viajes (ida y regreso desde Bogotá) para ver el cierre.</div>'}</div>
${L.map(t=>`<div class="card"><div class="r"><input type="checkbox" style="width:auto" ${sel.has(t.id)?'checked':''} onchange="this.checked?sel.add(${t.id}):sel.delete(${t.id});render()"><b style="flex:1">${e(lbl(t))}</b><button onclick="delTrip(${t.id})">✕</button></div><div class="sm">${t.date} · ${t.st=='open'?'en curso':'cerrado'} · ingresos ${fm(rev(t))} · gastos ${fm(exp(t))}</div>
${t.e.map((x,i)=>`<div class="k"><span>${e(x.c)}</span><span>${fm(x.v)} <button style="padding:2px 8px" onclick="delExp(${t.id},${i})">✕</button></span></div>`).join('')}
<div class="r"><select id="c${t.id}">${S.cats.map(c=>`<option>${e(c)}</option>`).join('')}<option value="+">+ Nueva…</option></select><input id="v${t.id}" type="number" placeholder="Valor"><button onclick="addExp(${t.id})">+</button></div></div>`).join('')||'<div class="sm">Aún no hay viajes.</div>'}`}
function addExp(id){let c=$('c'+id).value;const v=+$('v'+id).value;if(c=='+'){c=(prompt('Nombre del gasto')||'').trim();if(!c)return;S.cats.push(c)}if(!v)return toast('Escribe el valor');S.trips.find(t=>t.id==id).e.push({c,v});save();render()}
const delExp=(id,i)=>{S.trips.find(t=>t.id==id).e.splice(i,1);save();render()},delTrip=id=>{if(confirm('¿Borrar este viaje?')){S.trips=S.trips.filter(t=>t.id!=id);if(S.cur==id)S.cur=null;save();render()}};
render();
</script></body></html>
