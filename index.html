add('Viajes',['Fecha','Orden','Ruta','Estado','Pasajeros','Con tiquete','Sin tiquete','Tiquete después','Ingresos','Gastos','Neto'],S.trips.map(t=>[t.date,t.n,rt(t),t.st=='open'?'En curso':'Cerrado',sum(t.p),sum(t.p.filter(x=>x.tk=='si')),sum(t.p.filter(x=>x.tk=='no')),sum(t.p.filter(x=>x.tk=='dp')),rev(t,true),exp(t),rev(t,true)-exp(t)]));
add('Pasajeros',['Fecha','Orden','Ruta','Silla','Sube en','Baja en','Cantidad','Precio','Total','Tiquete','Ya bajó'],S.trips.flatMap(t=>t.p.map(p=>[t.date,t.n,rt(t),p.s,p.from,p.to,p.qty,p.price,p.qty*p.price,tkL[p.tk]||'',p.off?'Sí':'No'])));
add('Gastos',['Fecha','Orden','Ruta','Tipo de gasto','Valor'],S.trips.flatMap(t=>t.e.map(x=>[t.date,t.n,rt(t),x.c,x.v])));
add('Rutas y precios',['Ruta','Parada #','Parada','Tarifa acumulada desde Bogotá'],[...S.routes.flatMap(r=>r.stops.map((s,j)=>[r.name,j+1,s.n,s.p])),...S.prices.map(x=>['Excepción de precio','',x.a+' ↔ '+x.b,x.p])]);
add('Novedades',['Fecha','Tipo','Motivo','Nota'],Object.keys(S.log).sort().map(d=>[d,S.log[d].st=='skip'?'No realizada':'Cambio de ruta',S.log[d].why||'',S.log[d].note||'']));
add('Mantenimiento',['Mantenimiento','Cada (días)','Cada (km)','Último','Último km','Próxima fecha','Próximo km','Estado'],S.mt.items.map(it=>{const s=mtStatus(it);return[it.name,it.days||'',it.km||'',it.last||'',nn(it.lastKm),s.d||'',nn(s.k),{due:'Vencido',soon:'Próximo',ok:'Al día',none:'Sin registro'}[s.st]]}));
add('Historial mantenimiento',['Mantenimiento','Fecha','Km','Costo','Nota'],S.mt.items.flatMap(it=>it.h.map(x=>[it.name,x.date,nn(x.km),x.cost||0,x.note||''])));
add('Arreglos y ajustes',['Pieza o trabajo','Fecha','Km','Costo','Nota'],S.mt.repairs.map(r=>[r.piece,r.date,nn(r.km),r.cost||0,r.note||'']));
add('Por hacer',['Tarea','Estado','Fecha en que se hizo'],S.mt.todo.map(t=>[t.t,t.done?'Hecho':'Pendiente',t.dd||'']));
const js=JSON.stringify(S),ch=[];for(let i=0;i<js.length;i+=30000)ch.push([js.slice(i,i+30000)]);add('_datos',['NO EDITAR: datos para restaurar la app'],ch);
wb.Workbook={Sheets:wb.SheetNames.map(n=>({Hidden:n=='_datos'?1:0}))};return wb}
async function backupNow(){const prev=S.lastBackup;try{await loadX();S.lastBackup=new Date().toISOString();const out=XLSX.write(buildWb(),{bookType:'xlsx',type:'array'}),name='FLM_respaldo_'+today()+'.xlsx',f=new File([out],name,{type:XL});let ok=false;if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Respaldo Flota La Macarena'});ok=true}catch(x){if(x.name=='AbortError'){S.lastBackup=prev;return}}}if(!ok)dl(f,name);save();render();toast('Respaldo generado')}catch(x){S.lastBackup=prev;toast('No pude generar el Excel (revisa tu internet)')}}
async function restoreX(f){if(!f)return;try{await loadX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets['_datos'];if(!ws)return toast('Ese Excel no es un respaldo de esta app');const d=JSON.parse(XLSX.utils.sheet_to_json(ws,{header:1}).slice(1).map(r=>r[0]||'').join(''));if(!d.orders||!d.trips||!d.bus)throw 0;if(!confirm('Esto reemplaza todos los datos actuales por los del respaldo. ¿Continuar?'))return;S=d;save();render();toast('Datos restaurados')}catch(x){toast('No pude leer el respaldo')}}
function icsRem(){const d=new Date();d.setDate(d.getDate()+1);const dd=iso(d).replace(/-/g,''),t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Flota La Macarena//Respaldo//ES','BEGIN:VEVENT','UID:flm-'+Date.now()+'@flotalamacarena','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+dd+'T080000','DTEND:'+dd+'T081500','RRULE:FREQ=DAILY;INTERVAL=2','SUMMARY:Respaldar app Flota La Macarena','DESCRIPTION:Abre la app > Mi bus > Respaldar ahora y guarda el Excel en tu nube.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Respaldar app Flota La Macarena','TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');dl(new Blob([t],{type:'text/calendar'}),'recordatorio-respaldo.ics');toast('Abre el archivo para agregarlo a tu calendario')}
function bkCard(){const L=S.lastBackup?new Date(S.lastBackup):null;return `<div class="card"><h3>Respaldo en la nube</h3><div class="sm">${L?'Último respaldo: '+L.toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'Aún no has hecho ningún respaldo.'}</div><button class="pr" onclick="backupNow()">Respaldar ahora (Excel)</button><div class="sm" style="margin-top:6px">Genera un Excel con todo en pestañas. Al terminar, el celular te deja elegir dónde guardarlo: Google Drive, OneDrive, WhatsApp o correo.</div><label class="r" style="color:var(--tx)"><input type="checkbox" style="width:auto" ${S.bkRem!==false?'checked':''} onchange="S.bkRem=this.checked;save();head()"> Avisarme en la app cada 2 días</label><button style="width:100%" onclick="icsRem()">Agregar recordatorio cada 2 días al calendario</button><label>Restaurar desde un respaldo (.xlsx)</label><input type="file" accept=".xlsx" onchange="restoreX(this.files[0])"></div>`}
function vBus(){return `${bkCard()}<div class="card"><h3>Mi bus</h3>${S.bus.photo?`<img class="ph" src="${S.bus.photo}" alt="Foto del bus">`:''}<label>Foto del carro</label><input type="file" accept="image/*" onchange="photo(this.files[0])"><label>Número del bus (se muestra arriba)</label><input value="${e(S.bus.name)}" onchange="S.bus.name=this.value;save()"><label>Placa</label><input value="${e(S.bus.plate)}" onchange="S.bus.plate=this.value;save()"><label>Número de sillas (normalmente 40 a 45)</label><input type="number" min="1" max="60" value="${S.bus.seats}" onchange="S.bus.seats=Math.max(1,Math.min(60,+this.value||40));save();render()"></div>
<div class="card"><h3>Distribución de sillas</h3><div class="sm">Toca una silla para quitarla o ponerla (pasillo, baño, silla dañada). Sillas activas: <b>${S.bus.seats-S.bus.off.filter(id=>id<=S.bus.seats).length}</b></div></div>${grid(null,true)}`}
const tg=id=>{const i=S.bus.off.indexOf(id);i>=0?S.bus.off.splice(i,1):S.bus.off.push(id);save();render()};
function photo(f){if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.bus.photo=c.toDataURL('image/jpeg',.7);save();render()};im.src=URL.createObjectURL(f)}
// Cierres
const rev=(t,all)=>t.p.filter(x=>all||S.cfg.notk||x.tk!='no').reduce((s,x)=>s+x.qty*x.price,0),exp=t=>t.e.reduce((s,x)=>s+x.v,0),lbl=t=>{const o=S.orders.find(x=>x.n==t.n)||{};return `#${t.n} ${o.o||''} → ${o.d||''}`};
function vClose(){const L=S.trips.slice().reverse(),T=L.filter(t=>sel.has(t.id)),nt=T.reduce((s,t)=>s+sum(t.p.filter(x=>x.tk=='no')),0);
return `<div class="card"><label class="r" style="color:var(--tx);margin:0"><input type="checkbox" style="width:auto" ${S.cfg.notk?'checked':''} onchange="S.cfg.notk=this.checked;save();render()"> Incluir pasajeros sin tiquete en los cierres</label></div>
<div class="card"><h3>${T.length>1?'Cierre de viaje redondo':'Cierre de recorrido'}</h3>${T.length?`${T.map(t=>`<div class="k"><span>${e(lbl(t))}</span><span>${fm(rev(t)-exp(t))}</span></div>`).join('')}<hr><div class="k"><span>Pasajeros</span><b>${T.reduce((s,t)=>s+sum(t.p.filter(x=>S.cfg.notk||x.tk!='no')),0)}</b></div><div class="k"><span>Sin tiquete (${S.cfg.notk?'incluidos':'excluidos'})</span><b>${nt}</b></div><div class="k"><span>Ingresos</span><b>${fm(T.reduce((s,t)=>s+rev(t),0))}</b></div><div class="k"><span>Gastos</span><b>${fm(T.reduce((s,t)=>s+exp(t),0))}</b></div><div class="k" style="font-size:18px"><span>Neto</span><b>${fm(T.reduce((s,t)=>s+rev(t)-exp(t),0))}</b></div>`:'<div class="sm">Marca uno o varios viajes (ida y regreso desde Bogotá) para ver el cierre.</div>'}</div>
${L.map(t=>`<div class="card"><div class="r"><input type="checkbox" style="width:auto" ${sel.has(t.id)?'checked':''} onchange="this.checked?sel.add(${t.id}):sel.delete(${t.id});render()"><b style="flex:1">${e(lbl(t))}</b><button onclick="delTrip(${t.id})">✕</button></div><div class="sm">${t.date} · ${t.st=='open'?'en curso':'cerrado'} · ingresos ${fm(rev(t))} · gastos ${fm(exp(t))}</div>
${t.e.map((x,i)=>`<div class="k"><span>${e(x.c)}</span><span>${fm(x.v)} <button style="padding:2px 8px" onclick="delExp(${t.id},${i})">✕</button></span></div>`).join('')}
<div class="r"><select id="c${t.id}">${S.cats.map(c=>`<option>${e(c)}</option>`).join('')}<option value="+">+ Nueva…</option></select><input id="v${t.id}" type="number" placeholder="Valor"><button onclick="addExp(${t.id})">+</button></div></div>`).join('')||'<div class="sm">Aún no hay viajes.</div>'}`}
function addExp(id){let c=$('c'+id).value;const v=+$('v'+id).value;if(c=='+'){c=(prompt('Nombre del gasto')||'').trim();if(!c)return;S.cats.push(c)}if(!v)return toast('Escribe el valor');S.trips.find(t=>t.id==id).e.push({c,v});save();render()}
const delExp=(id,i)=>{S.trips.find(t=>t.id==id).e.splice(i,1);save();render()},delTrip=id=>{if(confirm('¿Borrar este viaje?')){S.trips=S.trips.filter(t=>t.id!=id);if(S.cur==id)S.cur=null;save();render()}};
render();
</script></body></html>
